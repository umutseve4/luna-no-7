name: qa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scene contract
        run: python3 scripts/qa_gate.py

      - name: Pages hygiene
        run: |
          test -f .nojekyll || { echo '.nojekyll is required so Pages serves index.html verbatim'; exit 1; }
          test -f LICENSE || { echo 'LICENSE is required'; exit 1; }
          grep -q 'MIT License' LICENSE || { echo 'LICENSE must be the MIT text'; exit 1; }
          echo 'OK'

  mutation:
    name: mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract the historical inline gate
        run: python3 scripts/extract_baseline_gate.py 6eab73f8c35aa94de072d93642495b04e5351dba /tmp/baseline_gate.py

      - name: Extract the README of the baseline commit
        run: git show 6eab73f8c35aa94de072d93642495b04e5351dba:README.md > /tmp/baseline_README.md

      - name: Break the scene on purpose
        run: python3 scripts/mutation_check.py --baseline /tmp/baseline_gate.py --baseline-readme /tmp/baseline_README.md
