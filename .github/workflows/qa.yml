name: qa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scene contract
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          low = html.casefold()
          failures = []

          def need(condition, message):
              if not condition:
                  failures.append(message)

          # --- document shell -------------------------------------------------
          need(low.startswith("<!doctype html>"), "index.html must start with <!doctype html>")
          need('lang="tr"' in low, 'the <html> element must declare lang="tr" (the UI copy is Turkish)')
          need('name="viewport"' in low, "a viewport meta tag is required for the mobile layout")
          need('name="theme-color"' in low, "theme-color must stay in sync with the night background")
          need("<title>" in low, "the document needs a title")

          # --- dependency pinning ---------------------------------------------
          srcs = re.findall(r'<script[^>]+src="([^"]+)"', html)
          need(len(srcs) == 2, f"expected exactly 2 external scripts (three + OrbitControls), found {len(srcs)}: {srcs}")
          need(all(s.startswith("https://") for s in srcs), f"every external script must be https, got {srcs}")
          versions = {m for m in re.findall(r'three@([0-9]+\\.[0-9]+\\.[0-9]+)', html)}
          need(len(versions) == 1, f"three must be pinned to a single exact version, found {sorted(versions)}")
          need("OrbitControls.js" in html, "OrbitControls is required for the orbit camera")
          need("http://" not in html, "no plaintext http:// references are allowed")

          # --- the three atmosphere modes -------------------------------------
          modes = re.findall(r'data-m="([a-z]+)"', html)
          need(sorted(modes) == ["day", "festival", "night"],
               f'the mode switcher must expose exactly day/night/festival, found {sorted(modes)}')
          for mode in ("day", "night", "festival"):
              need(re.search(mode + r'\\s*:\\s*\\{', html) is not None,
                   f'the palette table T is missing an entry for "{mode}"')

          # --- accessibility ---------------------------------------------------
          need("prefers-reduced-motion:reduce" in html.replace(" ", ""),
               "the scene must query prefers-reduced-motion and slow itself down")
          need("focus-visible" in low, "buttons must keep a visible keyboard focus ring")
          need("aria-label" in low, "the mode switcher must be labelled for screen readers")

          # --- no hidden network or storage ------------------------------------
          for forbidden in ("fetch(", "XMLHttpRequest", "localStorage", "sessionStorage", "navigator.sendBeacon"):
              need(forbidden not in html, f"the scene must not use {forbidden}; it is a self-contained offline page")

          # --- README contract --------------------------------------------------
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          rlow = readme.casefold()
          version = sorted(versions)[0] if versions else ""
          for phrase in ("sınırlar", "gündüz", "normal gece", "festival", "orbitcontrols", version):
              need(phrase.casefold() in rlow, f'README.md must document "{phrase}"')
          need("LICENSE" in readme, "README.md must point at the licence")

          if failures:
              print("QA gate failed:")
              for f in failures:
                  print(" -", f)
              sys.exit(1)
          print(f"OK — {len(srcs)} pinned scripts, three@{sorted(versions)[0]}, 3 atmosphere modes, README contract intact.")
          PY

      - name: Pages hygiene
        run: |
          test -f .nojekyll || { echo '.nojekyll is required so Pages serves index.html verbatim'; exit 1; }
          test -f LICENSE || { echo 'LICENSE is required'; exit 1; }
          grep -q 'MIT License' LICENSE || { echo 'LICENSE must be the MIT text'; exit 1; }
          echo 'OK'
